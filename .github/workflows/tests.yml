name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-smoke-tests:
    name: Frontend smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest

  edge-function-tests:
    name: Edge Function unit tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The Stripe signature check and event mapping (supabase/functions/_shared)
      # are pure Web-Crypto code with an independently computed HMAC test vector.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - run: deno test supabase/functions/_shared/

  pgtap-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # supabase/config.toml pulls several env(...) values (Turnstile secret,
      # Google/Azure OAuth, SMTP) from the git-ignored supabase/.env that
      # exists on a real dev machine - without it, Supabase CLI/GoTrue fail
      # to start rather than just running with those features off. pgTAP
      # tests talk to Postgres directly via the `tests` helper schema
      # (tests.create_user/tests.authenticate_as, see supabase/tests/00_helpers.sql)
      # and never exercise GoTrue's HTTP auth/OAuth/email endpoints, so these
      # only need to be non-empty strings to satisfy startup validation -
      # never real credentials, never secrets, safe to commit in a public
      # workflow file.
      - name: Write CI-only placeholder supabase/.env
        run: |
          cat > supabase/.env <<'EOF'
          TURNSTILE_SECRET=ci-placeholder-not-a-real-secret
          GOOGLE_OAUTH_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          GOOGLE_OAUTH_SECRET=ci-placeholder-secret
          AZURE_OAUTH_CLIENT_ID=ci-placeholder-client-id
          AZURE_OAUTH_SECRET=ci-placeholder-secret
          APPLE_OAUTH_CLIENT_ID=ci-placeholder-client-id
          APPLE_OAUTH_SECRET=ci-placeholder-secret
          SMTP_HOST=inbucket
          SMTP_PORT=1025
          SMTP_USER=mailpit
          SMTP_PASS=mailpit
          SMTP_ADMIN_EMAIL=ci@example.com
          EOF

      # The pgTAP suite talks to Postgres directly and only needs the auth and
      # storage SCHEMAS that the gotrue and storage-api containers create, so
      # start just those three containers (validated: 757/757 pass) instead of
      # ten. That matters because ghcr.io throttles anonymous image pulls from
      # shared runners ("toomanyrequests" - this failed the 2026-09-23 runs, not
      # the code): three pulls have far fewer chances to hit it than ten. Even so, retry twice with a
      # back-off; a start that still fails is reported by the next step as
      # ::error annotations (readable via the public check-runs API, unlike the
      # raw job log which needs admin rights).
      - name: Start local Supabase stack
        run: |
          set -o pipefail
          # Rotate through the registries that host the same Supabase images: a
          # throttled one (ghcr.io answered "toomanyrequests" for the database image
          # itself on 2026-09-23) shouldn't fail the suite when Docker Hub / AWS
          # public ECR would serve it. "" = the CLI's own default.
          for registry in "" docker.io public.ecr.aws ghcr.io; do
            if [ -n "$registry" ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry"; fi
            echo "supabase start (registry: ${registry:-default})"
            if supabase start -x studio,edge-runtime,imgproxy,vector,logflare,postgres-meta,supavisor,mailpit,realtime,postgrest,kong 2>&1 | tee -a /tmp/supabase-start.log; then
              # the pgTAP step pulls one more image (pg_prove): start it on the registry that worked
              if [ -n "$registry" ]; then echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry" >> "$GITHUB_ENV"; fi
              exit 0
            fi
            echo "start failed with registry '${registry:-default}' - trying the next one"
            supabase stop --no-backup || true
            sleep 45
          done
          exit 1

      # `supabase test db` pulls the pg_prove image, which hits the same registry
      # throttling. Retry on ANOTHER registry only when the failure was an image
      # pull; a genuine test failure fails the job immediately.
      - name: Run pgTAP suite
        run: |
          set -o pipefail
          for registry in "${SUPABASE_INTERNAL_IMAGE_REGISTRY:-}" docker.io public.ecr.aws ghcr.io; do
            if [ -n "$registry" ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry"; fi
            : > /tmp/supabase-test.log
            if supabase test db 2>&1 | tee /tmp/supabase-test.log; then exit 0; fi
            if ! grep -q -E "toomanyrequests|failed to pull" /tmp/supabase-test.log; then exit 1; fi
            echo "image pull failed with registry '${registry:-default}' - trying the next one"
            sleep 20
          done
          exit 1

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=supabase start (tail)::$(tail -n 30 /tmp/supabase-start.log 2>/dev/null | tr '\n' '|' | cut -c1-3000)"
          echo "::error title=pgTAP output (tail)::$(tail -n 40 /tmp/supabase-test.log 2>/dev/null | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=containers::$(docker ps -a --format '{{.Names}} {{.Status}}' | tr '\n' '|' | cut -c1-2000)"
