# Minimal Supabase CLI project config — the local `supabase` CLI stack reads
# this and fills defaults for everything not set here.
project_id = "sitestock"

[db]
port = 54322
major_version = 15

[auth]
enabled = true
# The canonical app URL. Every auth email flow in this app (signup
# confirmation, password reset, email change) passes its OWN
# emailRedirectTo/redirectTo computed from window.location at call time, so
# the same build works on localhost and on the deployed site. Supabase only
# honours a redirect that also appears in additional_redirect_urls below -
# keep both the local dev origins and the live GitHub Pages URL listed.
site_url = "https://arcoore.github.io/construction-order-delivery/"

# Password rules. Following current NIST / NCSC guidance: a longer minimum
# rather than arbitrary composition rules (which push people toward
# predictable patterns like "Password1!").
minimum_password_length = 10
# Wildcard (**) patterns so any path works (the app builds redirect URLs as
# origin + window.location.pathname, e.g. .../ or .../index.html).
additional_redirect_urls = [
  "https://arcoore.github.io/construction-order-delivery/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

# Bot / brute-force protection for the login and signup forms: Cloudflare
# Turnstile (free, privacy-friendly, no visible puzzle for most users). The
# frontend renders the widget and sends the token with signInWithPassword /
# signUp; GoTrue verifies it here before doing anything else, so a script
# hammering the endpoint is stopped at the door.
#
# Set up but OFF, on purpose. The widget exists (Cloudflare, "SiteStock",
# hostnames arcoore.github.io + localhost + 127.0.0.1) and TURNSTILE_SECRET is
# in supabase/.env. Verified working end-to-end against the local stack on
# 2026-09-07 (widget issues a token invisibly in Managed mode, login succeeds
# with it, GoTrue refuses a tokenless password grant).
#
# Left disabled here because `enabled = true` in this file would be carried to
# the HOSTED project by any `supabase config push` - and the deployed
# public/js/env.js has no Turnstile key on the arcoore.github.io branch, so
# hosted enforcement without a matching client widget would break every hosted
# login. To actually turn it on:
#   1. Set the site key on env.js's arcoore.github.io branch (value is in that
#      file's comment).
#   2. Flip `enabled` to true below.
#   3. `supabase config push`  (carries this whole [auth] block to hosted).
#   4. Deploy the env.js change.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

# Leaked-password protection (rejects passwords found in the Have I Been
# Pwned breach corpus via a k-anonymised hash prefix - the password never
# leaves the server). On hosted Supabase this is a Pro-plan feature, toggled
# under Authentication -> Passwords; left here as a reminder to turn it on.
# [auth.password]
# hibp_enabled = true

[auth.email]
enable_signup = true
# Account security (2026-09): a new account can't be used until the user
# clicks the confirmation link emailed to them.
enable_confirmations = true

# Real outbound email for auth (confirmation + password-reset links).
# Without this: the LOCAL stack captures every message in Mailpit
# (http://127.0.0.1:54324) and never sends it anywhere; the HOSTED project's
# built-in sender only reaches addresses in your own Supabase org and is
# heavily rate-limited. So a real SMTP provider is required to email actual
# users in either place.
#
# All five values are read from supabase/.env (git-ignored). That file, and
# supabase/.env.example, spell out the two free options: Resend (best
# deliverability, but no-domain sending is limited to your own address until
# you verify a domain) and Brevo (any recipient with just a verified sender,
# no domain). `supabase config push` carries this whole block, and the URLs
# above, to the hosted project.
[auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = "env(SMTP_PORT)"
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "SiteStock"

# Anti-abuse rate limits, enforced server-side by GoTrue, per client IP.
# These are also Supabase's own defaults - stated explicitly here so they're
# version-controlled and carried to the hosted project by `config push`,
# rather than living only as an unstated default that a dashboard change
# could quietly move.
[auth.rate_limit]
# Login + signup + token requests: 30 per 5-minute window per IP. A whole
# construction crew logging in from one office IP in the morning fits; a
# script hammering the endpoint does not.
sign_in_sign_ups = 30
# Confirmation- / reset-link verifications: 30 per 5-minute window per IP.
token_verifications = 30
# Access-token refreshes: 150 per 5-minute window per IP.
token_refresh = 150
# Confirmation / reset emails per hour. Supabase's own default is 2 (built
# for the throwaway built-in sender); raising it needs auth.email.smtp
# enabled (above). Brevo's own 300/day free cap is the real ceiling - 60/hour
# just stops Supabase blocking a launch-day burst first.
email_sent = 60

[auth.mfa]
max_enrolled_factors = 10

# TOTP (authenticator-app) two-factor. Opt-in per account from the Profile
# screen; once a verified factor exists, login requires the 6-digit code
# (client gate + an aal2 check on the sensitive write RPCs - migration 0040).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[api]
enabled = true
port = 54321
